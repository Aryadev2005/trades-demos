<style>
:root{
  --accent:#FF6A13;
  --ink:#121A22; --ink-2:#2A3540; --slate:#5B6873;
  --paper:#F5F2EC; --card:#FFFFFF; --line:#E2DDD3;
  --display:'Barlow Condensed',Impact,sans-serif;
  --body:'Manrope',system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
svg{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.005em;line-height:.95}
h1{font-size:clamp(52px,8.4vw,108px);font-weight:800}
h2{font-size:clamp(40px,5.6vw,68px);font-weight:800}
h3{font-size:26px;font-weight:700}
.kicker{font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.02em;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:3px;background:var(--accent)}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--slate);max-width:560px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:800;font-size:17px;padding:17px 26px;border-radius:12px;border:0;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 10px 24px -10px var(--accent)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.wa{background:#1FAF55;color:#fff}

/* demo ribbon */
.demo{background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:8px 16px}
.demo b{color:var(--accent)}

/* top bar + nav */
.topbar{background:var(--ink-2);color:#cfd6dc;font-size:14px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:9px;padding-bottom:9px}
.topbar span{display:inline-flex;align-items:center;gap:8px}
.topbar svg{width:16px;height:16px;color:var(--accent)}
nav{position:sticky;top:0;z-index:40;background:rgba(245,242,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.01em}
.mark{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:0 0 40px}
.mark svg{width:24px;height:24px}
.links{display:flex;gap:28px;font-weight:700;font-size:15px}
.links a:hover{color:var(--accent)}
nav .btn{padding:12px 18px;font-size:15px}
@media(max-width:900px){.links,.topbar .hide-m{display:none}}
@media(max-width:700px){
  .topbar .wrap{justify-content:center}.topbar a{display:none}
  nav .wrap{height:64px}nav .btn{display:none}
  .logo{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mark{width:34px;height:34px;flex-basis:34px}
  .demo{font-size:12px}
}

/* hero */
.hero{position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:72px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{margin:22px 0 32px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.rating{display:inline-flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:26px}
.rating .g{width:26px;height:26px}
.rating b{font-size:26px;font-family:var(--display);font-weight:800;line-height:1}
.stars{display:flex;gap:2px;color:#F5B301}
.stars svg{width:18px;height:18px}
.rating small{display:block;font-size:13px;color:var(--slate);font-weight:600}
.visual{position:relative;aspect-ratio:4/5;border-radius:26px;overflow:hidden;background:var(--ink)}
.visual img{width:100%;height:100%;object-fit:cover}
.visual svg.scene{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;left:-14px;bottom:28px;background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 20px 40px -18px rgba(18,26,34,.45);display:flex;gap:12px;align-items:center;max-width:260px}
.badge i{width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,#fff);color:var(--accent);display:grid;place-items:center;flex:0 0 42px}
.badge i svg{width:22px;height:22px}
.badge b{display:block;font-size:15px}
.badge span{font-size:13px;color:var(--slate)}
.vwrap{position:relative}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-top:36px}.visual{aspect-ratio:5/4}.badge{left:12px}}

/* promise strip */
.promise{background:var(--ink);color:#fff}
.promise .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.promise div{display:flex;align-items:center;gap:12px;padding:22px 18px;font-weight:700;border-left:1px solid rgba(255,255,255,.08)}
.promise div:first-child{border-left:0}
.promise svg{width:22px;height:22px;color:var(--accent);flex:0 0 22px}
@media(max-width:900px){.promise .wrap{grid-template-columns:1fr 1fr}.promise div{border-left:0;padding:16px 8px;font-size:14px}}

section{padding:96px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:44px;flex-wrap:wrap}
.head .lead{max-width:440px}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.s{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
.s:hover{transform:translateY(-4px);box-shadow:0 22px 40px -24px rgba(18,26,34,.4);border-color:transparent}
.s i{width:54px;height:54px;border-radius:14px;background:var(--paper);display:grid;place-items:center;color:var(--ink);margin-bottom:22px;transition:background .2s,color .2s}
.s:hover i{background:var(--accent);color:#fff}
.s i svg{width:28px;height:28px}
.s p{color:var(--slate);margin-top:8px}
@media(max-width:900px){.svc{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.svc{grid-template-columns:1fr}}

/* steps */
.steps{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stp{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.stp div{counter-increment:s;padding-top:20px;border-top:3px solid var(--ink)}
.stp div::before{content:counter(s,decimal-leading-zero);font-family:var(--display);font-weight:800;font-size:56px;color:var(--accent);line-height:1;display:block;margin-bottom:12px}
.stp p{color:var(--slate);margin-top:8px}
@media(max-width:800px){.stp{grid-template-columns:1fr}}

/* reviews */
.rev{display:grid;grid-template-columns:.8fr 1.6fr;gap:40px;align-items:start}
.score{background:var(--ink);color:#fff;border-radius:24px;padding:34px;position:sticky;top:96px}
.score b{font-family:var(--display);font-size:110px;font-weight:800;line-height:.85;display:block}
.score .stars{margin:14px 0 8px}
.score .stars svg{width:24px;height:24px}
.score p{color:#aab4bd}
.score .btn{margin-top:24px;width:100%}
.cards{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px}
.card .stars svg{width:16px;height:16px}
.card q{display:block;font-size:18px;font-weight:500;margin:12px 0 14px;quotes:none}
.card span{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.card span svg{width:18px;height:18px}
@media(max-width:900px){.rev{grid-template-columns:1fr}.score{position:static}}

/* areas */
.areas{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.chips svg{width:16px;height:16px;color:var(--accent)}
.map{border-radius:24px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:#dde3e6}
.map iframe{width:100%;height:100%;border:0;filter:grayscale(.35)}
@media(max-width:900px){.areas{grid-template-columns:1fr}}

/* quote */
.quote{background:var(--ink);color:#fff;border-radius:30px;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:1fr 1fr;gap:48px;position:relative;overflow:hidden}
.quote::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--accent);opacity:.12;left:-180px;bottom:-220px}
.quote .lead{color:#aab4bd;margin:18px 0 28px}
.quote .direct{display:grid;gap:12px;position:relative}
.quote .direct a{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.06);font-weight:800;font-size:18px}
.quote .direct a:hover{background:rgba(255,255,255,.11)}
.quote .direct svg{width:22px;height:22px;color:var(--accent)}
form{display:grid;gap:12px;position:relative;z-index:1}
label{font-size:13px;font-weight:700;color:#aab4bd;display:grid;gap:6px}
input,select,textarea{font-family:var(--body);font-size:16px;padding:15px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;outline:none;width:100%}
select option{color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form .btn{margin-top:6px}
.fine{font-size:13px;color:#8995a0}
@media(max-width:900px){.quote{grid-template-columns:1fr}.two{grid-template-columns:1fr}}

footer{padding:56px 0 110px;color:var(--slate);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
footer .logo{color:var(--ink)}

/* sticky mobile bar */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(245,242,236,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.mbar .btn{flex:1;padding:15px 10px}
@media(max-width:700px){.mbar{display:flex}}

.rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
</style>
</head>

const app = document.getElementById('app');
app.innerHTML = `
${C.demo_banner ? `<div class="demo">Preview built for <b>${C.business}</b> by ${C.built_by}. Not live, just a sample of what your site could look like.</div>` : ''}
<div class="topbar"><div class="wrap">
  <span>${ic('pin')} ${C.trade} serving ${C.town} & ${C.county}</span>
  <span class="hide-m">${ic('clock')} ${C.hours}</span>
  <a href="${tel}"><span>${ic('phone')} ${C.phone}</span></a>
</div></div>
<nav><div class="wrap">
  <a href="#top" class="logo"><span class="mark">${ic(C.services[0]?.icon||'home')}</span>${C.business}</a>
  <div class="links"><a href="#services">Services</a><a href="#reviews">Reviews</a><a href="#areas">Areas</a><a href="#quote">Free quote</a></div>
  <a href="${tel}" class="btn primary">${ic('phone')} Call now</a>
</div></nav>

<header class="hero" id="top"><div class="wrap">
  <div>
    <a class="rating rv" ${C.google_url?`href="${C.google_url}" target="_blank" rel="noopener"`:''}>${gLogo}<b>${C.rating.toFixed(1)}</b><div>${stars()}<small>from ${C.review_count} Google reviews</small></div></a>
    <h1 class="rv">${hl}</h1>
    <p class="lead rv">${C.subline}</p>
    <div class="cta rv">
      <a href="#quote" class="btn primary">Get a free quote ${ic('arrow')}</a>
      ${hasWA ? `<a href="${waLink(`Hi ${C.business}, I'd like a quote please.`)}" class="btn wa" target="_blank" rel="noopener">${wa} WhatsApp us</a>` : `<a href="${tel}" class="btn ghost">${ic('phone')} ${C.phone}</a>`}
    </div>
  </div>
  <div class="vwrap rv">
    <div class="visual">${C.hero_image ? `<img src="${C.hero_image}" alt="${C.business} at work">` : scene}</div>
    <div class="badge"><i>${ic('shield')}</i><div><b>${C.rating.toFixed(1)} stars locally</b><span>${C.review_count} neighbours in ${C.town} rate us on Google</span></div></div>
  </div>
</div></header>

<div class="promise"><div class="wrap">${C.promises.slice(0,4).map(p=>`<div>${ic('check')}${p}</div>`).join('')}</div></div>

<section id="services"><div class="wrap">
  <div class="head rv"><div><div class="kicker">What we do</div><h2>${C.trade_plural} services<br>across ${C.town}</h2></div><p class="lead">One call covers it. We tell you what's wrong, what it costs, and when it'll be done.</p></div>
  <div class="svc">${C.services.map(s=>`<div class="s rv"><i>${ic(s.icon)}</i><h3>${s.name}</h3><p>${s.text}</p></div>`).join('')}</div>
</div></section>

<section class="steps"><div class="wrap">
  <div class="head rv"><div><div class="kicker">How it works</div><h2>Simple from<br>first call to finish</h2></div></div>
  <div class="stp">
    <div class="rv"><h3>Tell us the problem</h3><p>Call, WhatsApp or send the form. Photos help if you have them.</p></div>
    <div class="rv"><h3>Get a clear quote</h3><p>We take a look and give you a price up front, with no surprises later.</p></div>
    <div class="rv"><h3>Job done, site tidy</h3><p>We turn up when we say, do the work right, and clean up after.</p></div>
  </div>
</div></section>

<section id="reviews"><div class="wrap">
  <div class="rev">
    <div class="score rv"><div class="kicker" style="color:var(--accent)">Google rating</div><b>${C.rating.toFixed(1)}</b>${stars()}<p>Based on ${C.review_count} reviews from customers around ${C.town}.</p>
      ${C.google_url?`<a class="btn primary" href="${C.google_url}" target="_blank" rel="noopener">Read them on Google ${ic('arrow')}</a>`:''}</div>
    <div class="cards">${C.reviews.map(r=>`<div class="card rv">${stars()}<q>${r.text}</q><span>${gLogo.replace('class="g"','')} ${r.name}</span></div>`).join('')}</div>
  </div>
</div></section>

<section id="areas" style="padding-top:0"><div class="wrap">
  <div class="areas">
    <div class="rv"><div class="kicker">Where we work</div><h2>Local to ${C.town}</h2><p class="lead" style="margin-top:16px">Based in ${C.town} and working across ${C.county}. Not sure if we cover you? Just ask.</p>
      <div class="chips">${C.areas.map(a=>`<span>${ic('pin')}${a}</span>`).join('')}</div></div>
    <div class="map rv"><iframe loading="lazy" title="Map of ${C.town}" src="https://www.google.com/maps?q=${encodeURIComponent(C.business+' '+C.town)}&output=embed"></iframe></div>
  </div>
</div></section>

<section id="quote" style="padding-top:0"><div class="wrap">
  <div class="quote rv">
    <div>
      <div class="kicker">Free quote</div><h2>Tell us what<br>needs doing</h2>
      <p class="lead">Send the details and we'll come back to you quickly. Prefer to talk? Call or WhatsApp.</p>
      <div class="direct">
        <a href="${tel}">${ic('phone')} ${C.phone}</a>
        ${hasWA?`<a href="${waLink(`Hi ${C.business}, I'd like a quote please.`)}" target="_blank" rel="noopener">${wa.replace('<svg','<svg style="color:#1FAF55"')} WhatsApp us</a>`:''}
        ${C.email?`<a href="mailto:${C.email}">${ic('mail')} ${C.email}</a>`:''}
      </div>
    </div>
    <form id="qf">
      <div class="two"><label>Your name<input name="n" required></label><label>Phone<input name="p" type="tel" required></label></div>
      <div class="two"><label>Type of job<select name="j">${C.services.map(s=>`<option>${s.name}</option>`).join('')}<option>Something else</option></select></label><label>Area<input name="a" placeholder="${C.areas[0]||C.town}"></label></div>
      <label>What's going on?<textarea name="d" placeholder="A short description helps us quote faster"></textarea></label>
      <button class="btn primary" type="submit">${hasWA?'Send via WhatsApp':'Send request'} ${ic('arrow')}</button>
      <p class="fine">${hasWA?'Opens WhatsApp with your details filled in. Nothing is sent until you press send.':'We will call you back.'}</p>
    </form>
  </div>
</div></section>

<footer><div class="wrap">
  <div><a href="#top" class="logo"><span class="mark">${ic(C.services[0]?.icon||'home')}</span>${C.business}</a><p style="margin-top:10px">${C.trade} · ${C.town}, ${C.county} · ${C.phone}</p></div>
  <p>© ${new Date().getFullYear()} ${C.business}</p>
</div></footer>

<div class="mbar"><a href="${tel}" class="btn dark">${ic('phone')} Call</a>${hasWA?`<a href="${waLink(`Hi ${C.business}, I'd like a quote please.`)}" class="btn wa" target="_blank" rel="noopener">${wa} WhatsApp</a>`:`<a href="#quote" class="btn primary">Free quote</a>`}</div>
`;

document.getElementById('qf').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const msg = `Hi ${C.business}, quote request:\nName: ${f.get('n')}\nPhone: ${f.get('p')}\nJob: ${f.get('j')}\nArea: ${f.get('a')||'-'}\n${f.get('d')||''}`;
  if (hasWA) window.open(waLink(msg), '_blank');
  else window.location.href = tel;
});

const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), {threshold:.12});
document.querySelectorAll('.rv').forEach((el,i) => { el.style.transitionDelay = (i%3)*80+'ms'; io.observe(el); });
</script>
</body>
</html>
